<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LGA — Épisode 1</title>
<style>
  :root{--pink:#ff1f7a;--pink-bright:#ff2d8f;--pink-dim:#b3155a;--black:#050005;--black-2:#0a0208;--text-dim:#e7c3d6}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--black);color:#fff;font-family:'Helvetica Neue',Arial,sans-serif;overflow-x:hidden}
  header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 40px;background:rgba(5,0,5,.75);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,31,122,.25)}
  .nav-logo img{height:68px;width:auto;filter:drop-shadow(0 0 16px rgba(255,31,122,.85)) drop-shadow(0 0 4px rgba(255,255,255,.3))}
  nav.links{display:flex;gap:42px;list-style:none}
  nav.links a{color:#f2f2f2;text-decoration:none;font-size:19px;letter-spacing:.6px;font-weight:700;position:relative;padding-bottom:6px;transition:color .25s ease}
  nav.links a:hover,nav.links a.active{color:var(--pink-bright)}
  nav.links a.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--pink-bright);box-shadow:0 0 8px var(--pink-bright)}
  .socials{display:flex;align-items:center;gap:18px}.socials a{color:var(--pink);display:flex;transition:transform .2s ease,color .2s ease}.socials a:hover{color:var(--pink-bright);transform:translateY(-2px)}.socials svg{width:20px;height:20px;fill:currentColor}
  .nav-toggle{display:none;background:none;border:none;cursor:pointer;padding:6px;z-index:110}.nav-toggle span{display:block;width:26px;height:2px;background:#fff;margin:6px 0;transition:transform .25s ease,opacity .25s ease}.nav-toggle.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}.nav-toggle.open span:nth-child(2){opacity:0}.nav-toggle.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
  .divider{width:1px;height:22px;background:rgba(255,255,255,.25)}
  .hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:#050005}
  .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%;opacity:.85}
  .hero-scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,0,5,.97) 0%,rgba(5,0,5,.78) 32%,rgba(5,0,5,.25) 58%,rgba(5,0,5,.55) 100%),linear-gradient(0deg,rgba(5,0,5,.9) 0%,rgba(5,0,5,.1) 30%,rgba(5,0,5,.1) 70%,rgba(5,0,5,.85) 100%)}
  .crack-corner{position:absolute;width:46vw;max-width:700px;opacity:.55;pointer-events:none;mix-blend-mode:screen}.crack-tl{top:-6%;left:-8%}.crack-br{bottom:-10%;right:-10%;transform:rotate(180deg)}
  .hero-inner{position:relative;z-index:2;width:100%;max-width:1400px;margin:0 auto;padding:118px 5vw 0}.hero-copy{display:flex;flex-direction:column;align-items:flex-start;max-width:560px}
  .episode-tag{width:min(300px,34vw);filter:drop-shadow(0 0 18px rgba(255,31,122,.5));margin-bottom:-18px;margin-left:2px;mix-blend-mode:screen}
  .logo-glossy{width:min(560px,46vw);filter:drop-shadow(0 10px 30px rgba(255,31,122,.45));margin-bottom:34px;mix-blend-mode:screen}
  .cta-row{display:flex;gap:16px;margin-bottom:34px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:40px;font-size:13px;font-weight:700;letter-spacing:1px;text-decoration:none;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.btn:hover{transform:translateY(-2px)}.btn-fill{background:linear-gradient(135deg,var(--pink-bright),var(--pink-dim));color:#fff;box-shadow:0 8px 24px rgba(255,31,122,.4)}.btn-fill:hover{box-shadow:0 10px 28px rgba(255,31,122,.6)}.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}.btn-outline:hover{border-color:var(--pink-bright);color:var(--pink-bright)}
  .play-icon{width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;color:var(--pink-dim)}.play-icon svg{width:7px;height:7px;margin-left:1px;fill:currentColor}
  .quote-block{border-top:1px solid rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.35);padding:14px 0}.quote-block p{font-size:13px;letter-spacing:1.5px;font-weight:700;line-height:1.9;color:var(--pink);text-transform:uppercase}
  .hero-visual{position:absolute;top:0;bottom:0;right:0;z-index:3;width:min(60vw,780px);pointer-events:none}.portrait{position:absolute;bottom:0;right:2%;height:97%;width:100%;object-fit:contain;object-position:bottom right;filter:drop-shadow(0 20px 45px rgba(0,0,0,.7));z-index:2}
  .mobile-socials{display:none}
  @media(max-width:980px){header{padding:14px 18px}.nav-logo img{height:44px}.nav-toggle{display:block}nav.links{display:flex;flex-direction:column;align-items:flex-start;gap:0;position:fixed;top:0;right:0;height:100vh;width:74vw;max-width:320px;background:rgba(5,0,5,.97);backdrop-filter:blur(14px);border-left:1px solid rgba(255,31,122,.3);padding:100px 30px 30px;transform:translateX(100%);transition:transform .3s ease;z-index:105}nav.links.open{transform:translateX(0)}nav.links a{width:100%;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px}.mobile-socials{display:flex;gap:20px;margin-top:26px}.mobile-socials a{color:var(--pink);display:flex}.mobile-socials svg{width:20px;height:20px;fill:currentColor}.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:104}.nav-overlay.open{display:block}.socials,.divider{display:none}.hero{min-height:auto;display:block}.hero-inner{padding:96px 6vw 0;text-align:left}.hero-copy{max-width:100%}.episode-tag{width:min(230px,48vw);margin-bottom:-10px}.logo-glossy{width:min(420px,82vw);margin-bottom:22px}.cta-row{gap:10px;margin-bottom:22px;flex-wrap:nowrap}.btn{padding:12px 16px;font-size:10.5px;letter-spacing:.6px;flex:1;justify-content:center;white-space:nowrap}.quote-block p{font-size:11px;letter-spacing:1px;line-height:1.7}.hero-visual{position:relative;inset:auto;width:100%;height:62vh;min-height:420px;margin-top:16px}.portrait{right:0;width:104%;left:-2%;object-position:bottom center}}
  @media(max-width:380px){.btn{font-size:9.5px;padding:11px 12px}.episode-tag{width:190px}.quote-block p{font-size:10px}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){var toggle=document.querySelector('.nav-toggle');var links=document.querySelector('nav.links');var overlay=document.querySelector('.nav-overlay');function closeMenu(){toggle.classList.remove('open');links.classList.remove('open');overlay.classList.remove('open')}toggle.addEventListener('click',function(){var isOpen=links.classList.toggle('open');toggle.classList.toggle('open',isOpen);overlay.classList.toggle('open',isOpen)});overlay.addEventListener('click',closeMenu);links.querySelectorAll('a').forEach(function(a){a.addEventListener('click',closeMenu)})});
</script>
</head>
<body>
<header>
  <div class="nav-logo"><img src="ChatGPT Image 10 sept. 2026 à 01_05_11.png" alt="LGA"></div>
  <nav class="links">
    <a href="index.html" class="active">ACCUEIL</a><a href="album.html">ALBUM</a><a href="actualites.html">ACTUALITÉS</a><a href="shooting.html">GALERIE</a><a href="apropos.html">À PROPOS</a><a href="contact.html">CONTACT</a>
    <div class="mobile-socials">
      <a href="contact.html" aria-label="Instagram">Instagram</a><a href="contact.html" aria-label="TikTok">TikTok</a><a href="contact.html" aria-label="YouTube">YouTube</a><a href="contact.html" aria-label="Spotify">Spotify</a>
    </div>
  </nav>
  <div class="socials"><div class="divider"></div><a href="contact.html">Instagram</a><a href="contact.html">TikTok</a><a href="contact.html">YouTube</a><a href="contact.html">Spotify</a></div>
  <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
</header>
<div class="nav-overlay"></div>
<section class="hero" id="accueil">
  <img class="hero-bg" src="ChatGPT Image 10 sept. 2026 à 00_51_54.png" alt="">
  <div class="hero-scrim"></div>
  <img class="crack-corner crack-tl" src="ChatGPT Image 10 sept. 2026 à 01_08_01.png" alt="">
  <img class="crack-corner crack-br" src="ChatGPT Image 10 sept. 2026 à 01_08_01.png" alt="">
  <div class="hero-inner"><div class="hero-copy">
    <img class="episode-tag" src="ChatGPT Image 10 sept. 2026 à 01_05_57.png" alt="Épisode 1">
    <img class="logo-glossy" src="ChatGPT Image 10 sept. 2026 à 01_05_11.png" alt="LGA">
    <div class="cta-row"><a href="album.html" class="btn btn-fill"><span class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>ÉCOUTER L'ALBUM</a><a href="apropos.html" class="btn btn-outline">DÉCOUVRIR L'UNIVERS</a></div>
    <div class="quote-block"><p>Des émotions réelles,<br>des histoires vraies,<br>bienvenue dans Épisode 1.</p></div>
  </div></div>
  <div class="hero-visual"><img class="portrait" src="ChatGPT Image 10 sept. 2026 à 00_58_43.png" alt="LGA"></div>
</section>
</body>
</html>
