<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGA — Galerie</title><link rel="stylesheet" href="style.css"><style>
.shooting-wrap{min-height:calc(100vh - 540px);padding:70px 5vw 110px;background:radial-gradient(circle at 50% 20%,rgba(255,37,212,.14),transparent 42%),#020204}
.shooting-intro{text-align:center;margin-bottom:45px}
.shooting-intro h1{margin:0 0 12px;font-size:clamp(48px,7vw,92px);letter-spacing:9px;text-shadow:0 0 14px #ff25d4}
.shooting-intro p{color:#c9c6d4;font-size:17px;letter-spacing:1px}
.shooting-gallery{max-width:1300px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.shooting-item{width:100%;aspect-ratio:9/16;border:2px solid #ff25d4;border-radius:20px;overflow:hidden;background:#08080c;box-shadow:0 0 24px rgba(255,37,212,.25);display:flex;align-items:center;justify-content:center}
.shooting-item img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center;transition:transform .4s ease}
.shooting-item:hover img{transform:scale(1.03)}
.shooting-note{text-align:center;color:#c9c6d4;margin-top:36px;font-size:13px;letter-spacing:1.5px}
@media(max-width:900px){.shooting-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.shooting-wrap{padding:50px 15px 80px}.shooting-intro h1{letter-spacing:5px}.shooting-intro p{font-size:14px}}
@media(max-width:520px){.shooting-gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.shooting-item{border-radius:14px}}
</style></head><body>
