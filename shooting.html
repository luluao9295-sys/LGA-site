<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGA — Galerie</title><link rel="stylesheet" href="style.css"><style>
.shooting-wrap{min-height:calc(100vh - 540px);padding:70px 5vw 110px;background:radial-gradient(circle at 50% 20%,rgba(255,37,212,.14),transparent 42%),#020204}.shooting-intro{text-align:center;margin-bottom:45px}.shooting-intro h1{margin:0 0 12px;font-size:clamp(48px,7vw,92px);letter-spacing:9px;text-shadow:0 0 14px #ff25d4}.shooting-intro p{color:#c9c6d4;font-size:17px;letter-spacing:1px}.shooting-gallery{max-width:1300px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.shooting-item{display:block;width:100%;aspect-ratio:3/4;border:2px solid #ff25d4;border-radius:20px;overflow:hidden;background:#08080c;box-shadow:0 0 24px rgba(255,37,212,.25);cursor:pointer;padding:0}.shooting-item img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center;transition:transform .4s ease}.shooting-item:nth-child(1) img{object-position:center 52%}.shooting-item:nth-child(2) img{object-position:center 50%}.shooting-item:nth-child(3) img{object-position:center 50%}.shooting-item:nth-child(4) img{object-position:center 50%}.shooting-item:nth-child(5) img{object-position:center 50%}.shooting-item:nth-child(6) img{object-position:center 50%}.shooting-item:hover img{transform:scale(1.025)}.shooting-note{text-align:center;color:#c9c6d4;margin-top:36px;font-size:13px;letter-spacing:1.5px}
.gallery-lightbox{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.gallery-lightbox.open{display:flex}.gallery-lightbox::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,37,212,.10),transparent 60%);pointer-events:none}.lightbox-image{position:relative;z-index:2;display:block;max-width:92vw;max-height:90vh;width:auto;height:auto;object-fit:contain;border:2px solid #ff25d4;border-radius:16px;box-shadow:0 0 45px rgba(255,37,212,.45),0 0 100px rgba(255,37,212,.15)}.lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;z-index:3;border:1px solid rgba(255,37,212,.8);background:rgba(10,10,15,.72);color:#fff;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,37,212,.25)}.lightbox-close{top:22px;right:22px;width:48px;height:48px;font-size:28px}.lightbox-prev,.lightbox-next{top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:32px}.lightbox-prev{left:22px}.lightbox-next{right:22px}.lightbox-close:hover,.lightbox-prev:hover,.lightbox-next:hover{background:#ff25d4;color:#000}.lightbox-counter{position:absolute;z-index:3;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;letter-spacing:2px;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:20px}
@media(max-width:900px){.shooting-gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.shooting-wrap{padding:50px 15px 80px}.shooting-intro h1{letter-spacing:5px}.shooting-intro p{font-size:14px}.lightbox-image{max-width:90vw;max-height:84vh;border-radius:12px}.lightbox-prev{left:10px}.lightbox-next{right:10px}.lightbox-close{top:12px;right:12px}}@media(max-width:520px){.shooting-gallery{grid-template-columns:repeat(2,1fr);gap:12px}.shooting-item{border-radius:14px}.lightbox-prev,.lightbox-next{width:42px;height:42px;font-size:26px}.lightbox-counter{bottom:12px}}
</style></head><body>
<header class="site-banner"><img src="banner-lga-episode1.png" alt="LGA — Épisode 1"></header><nav class="nav"><a href="index.html">ACCUEIL</a><a href="actualites.html">ACTUALITÉS</a><a href="album.html">ALBUM</a><a href="shooting.html" class="active">GALERIE</a><a href="apropos.html">À PROPOS</a><a href="contact.html">CONTACT</a></nav>
<main class="shooting-wrap"><div class="shooting-intro"><h1>GALERIE</h1><p>UNIVERS VISUEL · LGA · ÉPISODE 1</p></div><section class="shooting-gallery">
<button class="shooting-item" type="button" data-src="3A08AAED-DE88-4D30-AF58-76AB8E3321E5.png"><img src="3A08AAED-DE88-4D30-AF58-76AB8E3321E5.png" alt="LGA — galerie 1"></button><button class="shooting-item" type="button" data-src="54014E96-5F42-43AB-A27E-A2FD55DB6975.png"><img src="54014E96-5F42-43AB-A27E-A2FD55DB6975.png" alt="LGA — galerie 2"></button><button class="shooting-item" type="button" data-src="F563F5B8-9513-499D-8C4B-59ACD06D566A.png"><img src="F563F5B8-9513-499D-8C4B-59ACD06D566A.png" alt="LGA — galerie 3"></button><button class="shooting-item" type="button" data-src="IMG_2373.jpeg"><img src="IMG_2373.jpeg" alt="LGA — galerie 4"></button><button class="shooting-item" type="button" data-src="IMG_2374.jpeg"><img src="IMG_2374.jpeg" alt="LGA — galerie 5"></button><button class="shooting-item" type="button" data-src="IMG_2375.jpeg"><img src="IMG_2375.jpeg" alt="LGA — galerie 6"></button></section><div class="shooting-note">© LGA · VISUELS OFFICIELS</div></main>
<div class="gallery-lightbox" id="galleryLightbox" aria-hidden="true"><button class="lightbox-close" id="lightboxClose" type="button" aria-label="Fermer">×</button><button class="lightbox-prev" id="lightboxPrev" type="button" aria-label="Photo précédente">‹</button><img class="lightbox-image" id="lightboxImage" src="" alt="Photo de la galerie"><button class="lightbox-next" id="lightboxNext" type="button" aria-label="Photo suivante">›</button><div class="lightbox-counter" id="lightboxCounter">1 / 6</div></div>
<script>const items=[...document.querySelectorAll('.shooting-item')];const box=document.getElementById('galleryLightbox');const image=document.getElementById('lightboxImage');const counter=document.getElementById('lightboxCounter');let current=0;function showPhoto(i){current=(i+items.length)%items.length;image.src=items[current].dataset.src;counter.textContent=(current+1)+' / '+items.length;box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closePhoto(){box.classList.remove('open');box.setAttribute('aria-hidden','true');image.src='';document.body.style.overflow=''}items.forEach((item,i)=>item.addEventListener('click',()=>showPhoto(i)));document.getElementById('lightboxClose').addEventListener('click',closePhoto);document.getElementById('lightboxPrev').addEventListener('click',e=>{e.stopPropagation();showPhoto(current-1)});document.getElementById('lightboxNext').addEventListener('click',e=>{e.stopPropagation();showPhoto(current+1)});box.addEventListener('click',e=>{if(e.target===box)closePhoto()});document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')showPhoto(current-1);if(e.key==='ArrowRight')showPhoto(current+1)});</script></body></html>
