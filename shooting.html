<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGA — Galerie</title><link rel="stylesheet" href="style.css"><style>
.shooting-gallery{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-auto-flow:row!important;align-items:start!important;gap:34px 24px!important;width:100%!important;padding:0!important}.shooting-gallery>.shooting-item{display:block!important;width:100%!important;min-width:0!important;max-width:none!important;aspect-ratio:3/4!important;height:auto!important;line-height:0!important;overflow:hidden!important;position:relative!important;padding:0!important;background:#000!important;border:none!important;border-radius:28px!important;box-shadow:0 0 8px rgba(255,37,212,.55),0 0 20px rgba(255,37,212,.38),0 0 42px rgba(255,37,212,.20)!important;cursor:pointer;box-sizing:border-box;transition:box-shadow .25s ease,transform .25s ease}.shooting-item img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important;transform:none!important;background:#000!important;border-radius:28px!important}.shooting-item:hover{box-shadow:0 0 10px rgba(255,37,212,.75),0 0 26px rgba(255,37,212,.55),0 0 55px rgba(255,37,212,.30)!important;transform:translateY(-2px)}

</style></head><body><header class="site-banner"><img src="banner-lga-episode1.png" alt="LGA — Épisode 1"></header><nav class="nav"><a href="index.html">ACCUEIL</a><a href="actualites.html">ACTUALITÉS</a><a href="album.html">ALBUM</a><a href="shooting.html" class="active">GALERIE</a><a href="apropos.html">À PROPOS</a><a href="contact.html">CONTACT</a></nav><main class="shooting-wrap"><div class="shooting-intro"><h1>GALERIE</h1><p>UNIVERS VISUEL · LGA · ÉPISODE 1</p></div><section class="shooting-gallery"><button class="shooting-item" type="button" data-src="IMG_2374.jpeg"><img src="IMG_2374.jpeg" alt="LGA — galerie 1"></button><button class="shooting-item" type="button" data-src="3A08AAED-DE88-4D30-AF58-76AB8E3321E5.png"><img src="3A08AAED-DE88-4D30-AF58-76AB8E3321E5.png" alt="LGA — galerie 2"></button><button class="shooting-item" type="button" data-src="IMG_2375.jpeg"><img src="IMG_2375.jpeg" alt="LGA — galerie 3"></button><button class="shooting-item" type="button" data-src="IMG_2373.jpeg"><img src="IMG_2373.jpeg" alt="LGA — galerie 4"></button><button class="shooting-item" type="button" data-src="F563F5B8-9513-499D-8C4B-59ACD06D566A.png"><img src="F563F5B8-9513-499D-8C4B-59ACD06D566A.png" alt="LGA — galerie 5"></button><button class="shooting-item" type="button" data-src="54014E96-5F42-43AB-A27E-A2FD55DB6975.png"><img src="54014E96-5F42-43AB-A27E-A2FD55DB6975.png" alt="LGA — galerie 6"></button></section><div class="shooting-note">© LGA · VISUELS OFFICIELS</div></main><div class="gallery-lightbox" id="galleryLightbox" aria-hidden="true"><img class="lightbox-image" id="lightboxImage" src="" alt="Photo de la galerie"></div><script>const items=[...document.querySelectorAll('.shooting-item')],box=document.getElementById('galleryLightbox'),image=document.getElementById('lightboxImage');function showPhoto(i){image.src=items[i].dataset.src;box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closePhoto(){box.classList.remove('open');box.setAttribute('aria-hidden','true');image.src='';document.body.style.overflow=''}items.forEach((item,i)=>item.addEventListener('click',()=>showPhoto(i)));box.addEventListener('click',closePhoto);document.addEventListener('keydown',e=>{if(box.classList.contains('open')&&e.key==='Escape')closePhoto()});</script></body></html>
