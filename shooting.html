<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGA — Galerie</title><link rel="stylesheet" href="style.css"><style>
.shooting-gallery{align-items:start}
.shooting-item{display:block!important;width:100%!important;height:auto!important;aspect-ratio:4/5!important;line-height:0!important;overflow:hidden!important;position:relative!important;padding:0!important;background:#120812!important}
.shooting-item::before{content:"";position:absolute;inset:-18px;background-image:var(--photo-bg);background-size:cover;background-position:center;filter:blur(18px);opacity:.42;transform:scale(1.08);z-index:0}
.shooting-item::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.08));z-index:1;pointer-events:none}
.shooting-item img{position:relative!important;z-index:2!important;display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:contain!important;object-position:center center!important;transform:none!important;background:transparent!important}
.shooting-item:hover img{transform:none!important}
@media(max-width:900px){.shooting-gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.shooting-gallery{grid-template-columns:repeat(2,1fr);gap:12px}.shooting-item{border-radius:14px!important}}
</style></head><body><header class="site-banner"><img src="banner-lga-episode1.png" alt="LGA — Épisode 1"></header><nav class="nav"><a href="index.html">ACCUEIL</a><a href="actualites.html">ACTUALITÉS</a><a href="album.html">ALBUM</a><a href="shooting.html" class="active">GALERIE</a><a href="apropos.html">À PROPOS</a><a href="contact.html">CONTACT</a></nav><main class="shooting-wrap"><div class="shooting-intro"><h1>GALERIE</h1><p>UNIVERS VISUEL · LGA · ÉPISODE 1</p></div><section class="shooting-gallery"><button class="shooting-item" style="--photo-bg:url('3A08AAED-DE88-4D30-AF58-76AB8E3321E5.png')" type="button" data-src="3A08AAED-DE88-4D30-AF58-76AB8E3321E5.png"><img src="3A08AAED-DE88-4D30-AF58-76AB8E3321E5.png" alt="LGA — galerie 1"></button><button class="shooting-item" style="--photo-bg:url('54014E96-5F42-43AB-A27E-A2FD55DB6975.png')" type="button" data-src="54014E96-5F42-43AB-A27E-A2FD55DB6975.png"><img src="54014E96-5F42-43AB-A27E-A2FD55DB6975.png" alt="LGA — galerie 2"></button><button class="shooting-item" style="--photo-bg:url('F563F5B8-9513-499D-8C4B-59ACD06D566A.png')" type="button" data-src="F563F5B8-9513-499D-8C4B-59ACD06D566A.png"><img src="F563F5B8-9513-499D-8C4B-59ACD06D566A.png" alt="LGA — galerie 3"></button><button class="shooting-item" style="--photo-bg:url('IMG_2373.jpeg')" type="button" data-src="IMG_2373.jpeg"><img src="IMG_2373.jpeg" alt="LGA — galerie 4"></button><button class="shooting-item" style="--photo-bg:url('IMG_2374.jpeg')" type="button" data-src="IMG_2374.jpeg"><img src="IMG_2374.jpeg" alt="LGA — galerie 5"></button><button class="shooting-item" style="--photo-bg:url('IMG_2375.jpeg')" type="button" data-src="IMG_2375.jpeg"><img src="IMG_2375.jpeg" alt="LGA — galerie 6"></button></section><div class="shooting-note">© LGA · VISUELS OFFICIELS</div></main><div class="gallery-lightbox" id="galleryLightbox" aria-hidden="true"><button class="lightbox-close" id="lightboxClose" type="button">×</button><button class="lightbox-prev" id="lightboxPrev" type="button">‹</button><img class="lightbox-image" id="lightboxImage" src="" alt="Photo de la galerie"><button class="lightbox-next" id="lightboxNext" type="button">›</button><div class="lightbox-counter" id="lightboxCounter">1 / 6</div></div><script>const items=[...document.querySelectorAll('.shooting-item')],box=document.getElementById('galleryLightbox'),image=document.getElementById('lightboxImage'),counter=document.getElementById('lightboxCounter');let current=0;function showPhoto(i){current=(i+items.length)%items.length;image.src=items[current].dataset.src;counter.textContent=(current+1)+' / '+items.length;box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closePhoto(){box.classList.remove('open');box.setAttribute('aria-hidden','true');image.src='';document.body.style.overflow=''}items.forEach((item,i)=>item.addEventListener('click',()=>showPhoto(i)));document.getElementById('lightboxClose').addEventListener('click',closePhoto);document.getElementById('lightboxPrev').addEventListener('click',e=>{e.stopPropagation();showPhoto(current-1)});document.getElementById('lightboxNext').addEventListener('click',e=>{e.stopPropagation();showPhoto(current+1)});box.addEventListener('click',e=>{if(e.target===box)closePhoto()});document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')showPhoto(current-1);if(e.key==='ArrowRight')showPhoto(current+1)});</script></body></html>
