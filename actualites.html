<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGA — Actualités</title>
<link rel="stylesheet" href="menu-lga.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020103}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.actualites-page{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;background:#020103;isolation:isolate}
.scene{position:absolute;inset:0;overflow:hidden;z-index:0;background:#020103}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;filter:saturate(1.05) brightness(.92)}
.scene-car{position:absolute;left:0;bottom:0;width:68%;max-width:none;z-index:2;display:block;mix-blend-mode:normal}
.scene-person{position:absolute;left:50%;bottom:-1.5%;width:41%;max-width:none;transform:translateX(-50%);z-index:3;display:block}
.scene-smoke{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.28;z-index:4;pointer-events:none}
.scene::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.24) 0,rgba(0,0,0,.03) 20%,rgba(0,0,0,0) 62%,rgba(0,0,0,.12) 100%)}
.lga-menu{position:absolute;top:2.8svh;left:3.2vw;right:3.2vw;margin:0;z-index:100}
@media(min-width:1001px){.scene-bg{object-position:center}.scene-car{width:65%;left:-3%;bottom:-2%}.scene-person{width:39%;left:49%;bottom:-2%}}
@media(min-width:601px) and (max-width:1000px){.scene-bg{object-position:center}.scene-car{width:78%;left:-11%;bottom:1%}.scene-person{width:50%;left:52%;bottom:-1%}.lga-menu{top:2.7svh;left:18px;right:18px;margin:0}}
@media(max-width:600px){.actualites-page{min-height:640px}.scene-bg{width:auto;height:100%;min-width:100%;left:50%;transform:translateX(-50%);object-fit:cover;object-position:48% center}.scene-car{width:118vw;left:-43vw;bottom:10svh}.scene-person{width:76vw;left:53%;bottom:4svh}.scene-smoke{opacity:.22}.lga-menu{top:2.7svh;left:9px;right:9px;margin:0}}
@media(max-width:390px){.scene-car{width:122vw;left:-46vw;bottom:9svh}.scene-person{width:79vw;left:54%;bottom:3.5svh}.lga-menu{left:5px;right:5px}}
@media(max-height:520px) and (orientation:landscape){.scene-car{width:67%;left:-3%;bottom:-6%}.scene-person{width:38%;left:50%;bottom:-6%}.lga-menu{top:10px}}
</style>
</head>
<body>
<div class="actualites-page">
  <div class="scene" aria-hidden="true">
    <img class="scene-bg" src="19_decor_garage_sans_colonne_droite.svg?v=8" alt="">
    <img class="scene-car" src="13_voiture_complete.svg?v=8" alt="">
    <img class="scene-person" src="12_personnage_debout.svg?v=8" alt="">
    <img class="scene-smoke" src="18_fumee_ambiance_centre.svg?v=8" alt="">
  </div>
  <header class="lga-menu">
    <nav class="lga-nav">
      <a href="index.html">ACCUEIL</a>
      <a class="active" href="actualites.html">ACTUALITÉS</a>
      <a href="album.html">ALBUM</a>
      <a href="apropos.html">À PROPOS</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>
</div>
</body>
</html>
