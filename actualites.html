<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020103}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.actualites-page{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;background:#020103}
.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 57%;display:block}
.hero-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,1,3,.38) 0,rgba(2,1,3,.08) 13%,rgba(2,1,3,0) 30%);pointer-events:none}
.lga-menu{position:absolute;top:2.8svh;left:3.2vw;right:3.2vw;margin:0;z-index:100}
@media(max-width:1000px){.hero{object-position:center 55%}.lga-menu{top:2.7svh;left:18px;right:18px;margin:0}}
@media(max-width:600px){.actualites-page{min-height:640px}.hero{width:auto;height:100%;min-width:100%;left:50%;right:auto;transform:translateX(-50%);object-fit:cover;object-position:center 55%}.lga-menu{top:2.7svh;left:9px;right:9px;margin:0}}
@media(max-width:390px){.lga-menu{left:5px;right:5px}}

</head>
