<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020103}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.actualites-page{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;background:#020103}
.scene{position:absolute;inset:0;overflow:hidden;background:#020103}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.scene-car{position:absolute;z-index:2;display:block;max-width:none}
.scene-person{position:absolute;z-index:3;display:block;max-width:none}
.lga-menu{position:absolute;top:2.8svh;left:3.2vw;right:3.2vw;margin:0;z-index:100}
@media(min-width:1001px){.scene-car{width:64%;left:-2%;bottom:-1%}.scene-person{width:39%;left:49%;bottom:-2%;transform:translateX(-50%)}}
@media(min-width:601px) and (max-width:1000px){.scene-bg{object-position:47% center}.scene-car{width:80%;left:-14%;bottom:0}.scene-person{width:51%;left:52%;bottom:0;transform:translateX(-50%)}.lga-menu{top:2.7svh;left:18px;right:18px;margin:0}}
@media(max-width:600px){.actualites-page{min-height:640px}.scene-bg{width:100%;height:100%;object-fit:cover;object-position:43% center}.scene-car{width:105vw;left:-43vw;bottom:5svh}.scene-person{height:73svh;width:auto;left:51%;bottom:1svh;transform:translateX(-50%)}.lga-menu{top:2.7svh;left:9px;right:9px;margin:0}}
@media(max-width:390px){.scene-bg{object-position:42% center}.scene-car{width:108vw;left:-46vw;bottom:5svh}.scene-person{height:72svh;left:52%;bottom:1svh}.lga-menu{left:5px;right:5px}}
@media(max-height:520px) and (orientation:landscape){.scene-car{width:65%;left:-3%;bottom:-5%}.scene-person{height:88svh;width:auto;left:50%;bottom:-5%;transform:translateX(-50%)}.lga-menu{top:10px}}
</style>
</head>
