<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGA — Actualités</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020103}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.actualites-page{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;background:#020103}
.scene{position:absolute;inset:0;overflow:hidden;background:#020103}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.personnage{position:absolute;z-index:10;left:50%;bottom:-2svh;transform:translateX(-50%);height:82svh;width:auto;max-width:78vw;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 18px 30px rgba(0,0,0,.48)) drop-shadow(0 0 16px rgba(255,31,132,.22));pointer-events:none}
header{position:absolute;z-index:30;top:2.8svh;left:3.2vw;right:3.2vw;height:7.5svh;min-height:66px;max-height:82px;background:linear-gradient(180deg,rgba(12,10,12,.78),rgba(2,2,3,.72));border:1px solid rgba(255,255,255,.10);border-radius:28px;display:flex;align-items:center;padding:0 1vw;box-shadow:0 14px 42px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(20px) saturate(125%);-webkit-backdrop-filter:blur(20px) saturate(125%)}
.nav{display:flex;align-items:center;justify-content:space-evenly;width:100%;height:100%;white-space:nowrap}
.nav a{color:rgba(255,255,255,.88);text-decoration:none;font-size:18px;font-weight:700;letter-spacing:.03em;position:relative;height:100%;display:flex;align-items:center;padding:0 12px;transition:color .18s ease,text-shadow .18s ease}
.nav a:hover{color:#fff}
.nav a.active{color:#fff;text-shadow:0 0 14px rgba(255,45,149,.45)}
.nav a.active:after{content:"";position:absolute;left:27%;right:27%;bottom:10px;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,#ff70ba 25%,#ff2d95 50%,#ff70ba 75%,transparent);box-shadow:0 0 7px rgba(255,45,149,.85),0 0 16px rgba(255,45,149,.35)}
@media(max-width:900px){
  .scene-bg{object-position:45% center}
  .personnage{height:78svh;max-width:92vw;bottom:-1svh}
}
@media(max-width:600px){
  .actualites-page{height:100svh;min-height:0}
  .scene-bg{object-fit:cover;object-position:43% center}
  .personnage{left:50%;bottom:-1svh;height:72svh;max-width:96vw}
  header{top:max(12px,2.7svh);left:9px;right:9px;height:64px;min-height:64px;border-radius:22px;padding:0 3px}
  .nav a{font-size:clamp(10px,3vw,13px);padding:0 4px}
}
@media(max-width:390px){
  .scene-bg{object-position:42% center}
  .personnage{height:70svh;max-width:98vw}
  header{left:5px;right:5px}
  .nav a{font-size:9px;padding:0 2px}
}
@media(max-height:520px) and (orientation:landscape){
  header{top:10px}
  .personnage{height:88svh;bottom:-12svh}
}
</style>
</head>
<body>
<div class="actualites-page">
  <div class="scene" aria-hidden="true">
    <img class="scene-bg" src="0B4A8201-E419-4268-AD70-8E276AA98B3D.png?v=11" alt="">
    <img class="personnage" src="LGA_PERSONNAGE.png?v=2" alt="">
  </div>
  <header>
    <nav class="nav">
      <a href="index.html">ACCUEIL</a>
      <a class="active" href="actualites.html">ACTUALITÉS</a>
      <a href="album.html">ALBUM</a>
      <a href="apropos.html">À PROPOS</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>
</div>
</body>
</html>
