<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGA — Actualités</title>
<link rel="stylesheet" href="menu-lga.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020103}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.actualites-page{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;background:#020103;isolation:isolate}
.bg{position:absolute;inset:-35px;z-index:-2;background:url('20_decor_complet_sans_menu.svg?v=3') center/cover no-repeat;filter:blur(24px) brightness(.45) saturate(1.1);transform:scale(1.08)}
.hero{position:absolute;z-index:0;display:block;max-width:none}
.hero-mask{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(2,1,3,.32) 0,rgba(2,1,3,.05) 17%,transparent 34%);pointer-events:none}
.lga-menu{position:absolute;top:2.8svh;left:3.2vw;right:3.2vw;margin:0;z-index:100}
@media(min-width:1001px){.hero{inset:0;width:100%;height:100%;object-fit:cover;object-position:center}}
@media(min-width:601px) and (max-width:1000px){.hero{left:50%;top:52%;width:100%;height:auto;max-height:84svh;transform:translate(-50%,-50%);object-fit:contain}.lga-menu{top:2.7svh;left:18px;right:18px;margin:0}}
@media(max-width:600px){.actualites-page{min-height:640px}.bg{inset:-50px;filter:blur(28px) brightness(.36) saturate(1.12)}.hero{left:50%;top:52%;width:100%;height:auto;max-height:79svh;transform:translate(-50%,-50%);object-fit:contain}.lga-menu{top:2.7svh;left:9px;right:9px;margin:0}}
@media(max-width:390px){.hero{top:53%;max-height:77svh}.lga-menu{left:5px;right:5px}}
@media(max-height:520px) and (orientation:landscape){.hero{inset:0;width:100%;height:100%;max-height:none;transform:none;object-fit:cover}.lga-menu{top:10px}}
</style>
</head>
<body>
<div class="actualites-page">
  <div class="bg"></div>
  <img class="hero" src="20_decor_complet_sans_menu.svg?v=3" alt="LGA Actualités">
  <div class="hero-mask"></div>
  <header class="lga-menu">
    <nav class="lga-nav">
      <a href="index.html">ACCUEIL</a>
      <a class="active" href="actualites.html">ACTUALITÉS</a>
      <a href="album.html">ALBUM</a>
      <a href="apropos.html">À PROPOS</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>
</div>
</body>
</html>
