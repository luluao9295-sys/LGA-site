<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGA — Actualités</title>
<style>
:root{--pink:#ff2d95;--pink-soft:#ff79bd;--black:#030205}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--black)}
body{overflow:hidden;color:#fff;font-family:Arial,Helvetica,sans-serif}
.actualites-page{position:relative;width:100%;height:100svh;overflow:hidden;background:var(--black)}
.scene{position:absolute;inset:0;overflow:hidden;background:var(--black)}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.scene-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.02),rgba(0,0,0,.08) 50%,rgba(0,0,0,.34))}
.personnage{position:absolute;z-index:10;left:34%;bottom:-2svh;transform:translateX(-50%);height:82svh;width:auto;max-width:65vw;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 18px 30px rgba(0,0,0,.48)) drop-shadow(0 0 16px rgba(255,31,132,.22));pointer-events:none}
header{position:absolute;z-index:40;top:2.8svh;left:3.2vw;right:3.2vw;height:7.5svh;min-height:66px;max-height:82px;background:linear-gradient(180deg,rgba(12,10,12,.78),rgba(2,2,3,.72));border:1px solid rgba(255,255,255,.10);border-radius:28px;display:flex;align-items:center;padding:0 1vw;box-shadow:0 14px 42px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(20px) saturate(125%);-webkit-backdrop-filter:blur(20px) saturate(125%)}
.nav{display:flex;align-items:center;justify-content:space-evenly;width:100%;height:100%;white-space:nowrap}
.nav a{color:rgba(255,255,255,.88);text-decoration:none;font-size:18px;font-weight:700;letter-spacing:.03em;position:relative;height:100%;display:flex;align-items:center;padding:0 12px;transition:color .18s ease,text-shadow .18s ease}
.nav a:hover{color:#fff}
.nav a.active{color:#fff;text-shadow:0 0 14px rgba(255,45,149,.45)}
.nav a.active:after{content:"";position:absolute;left:27%;right:27%;bottom:10px;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,#ff70ba 25%,#ff2d95 50%,#ff70ba 75%,transparent);box-shadow:0 0 7px rgba(255,45,149,.85),0 0 16px rgba(255,45,149,.35)}
.news-panel{position:absolute;z-index:25;top:16svh;right:4vw;width:min(39vw,650px);display:flex;flex-direction:column;gap:clamp(8px,1.4svh,16px)}
.news-card,.release-card{background:linear-gradient(145deg,rgba(7,3,8,.91),rgba(1,1,2,.94));border:1px solid rgba(255,45,149,.72);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.news-card{height:clamp(100px,15svh,145px);padding:clamp(10px,1.5svh,16px);display:grid;grid-template-columns:clamp(90px,9.5vw,145px) 1fr 42px;align-items:center;gap:clamp(10px,1.3vw,20px);color:#fff;text-decoration:none}
.news-thumb{width:100%;height:100%;max-height:108px;border-radius:12px;object-fit:cover;border:1px solid rgba(255,45,149,.75)}
.news-copy strong{display:block;font-size:clamp(15px,1.3vw,20px);letter-spacing:.09em;margin-bottom:7px}
.news-copy span{display:block;font-size:clamp(10px,.85vw,13px);letter-spacing:.12em;color:#f7eaf2;margin-bottom:9px}
.news-copy time{font-size:clamp(9px,.8vw,12px);letter-spacing:.16em;color:var(--pink-soft)}
.news-arrow{width:38px;height:38px;border:2px solid var(--pink-soft);border-radius:50%;display:grid;place-items:center;color:var(--pink-soft);font-size:23px}
.release-card{height:clamp(76px,11svh,108px);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.release-copy small{display:block;font-size:10px;letter-spacing:.23em;margin-bottom:7px}
.release-copy strong{display:block;color:var(--pink-soft);font-size:clamp(13px,1.15vw,18px);letter-spacing:.14em}
.release-mark{width:52px;height:2px;background:linear-gradient(90deg,transparent,var(--pink),transparent);box-shadow:0 0 12px var(--pink)}

@media(max-width:700px) and (orientation:portrait){
  .scene-bg{object-position:center}
  .scene-shade{background:linear-gradient(180deg,transparent 42%,rgba(0,0,0,.20) 58%,rgba(0,0,0,.66) 100%)}
  .personnage{left:50%;bottom:25svh;height:61svh;max-width:96vw}
  header{top:2.7svh;left:9px;right:9px;height:64px;min-height:64px;border-radius:22px;padding:0 3px}
  .nav a{font-size:clamp(10px,3vw,13px);padding:0 4px}

  .news-panel{
    top:auto;
    left:8px;
    right:8px;
    bottom:max(8px,env(safe-area-inset-bottom));
    width:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto;
    gap:7px;
  }
  .news-card{
    min-width:0;
    height:88px;
    padding:7px;
    grid-template-columns:52px minmax(0,1fr);
    grid-template-rows:1fr;
    gap:7px;
    border-radius:13px;
  }
  .news-thumb{width:52px;height:72px;max-height:none;border-radius:8px}
  .news-copy{min-width:0}
  .news-copy strong{font-size:10px;line-height:1.05;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .news-copy span{font-size:7px;line-height:1.15;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .news-copy time{font-size:7px;line-height:1.1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .news-arrow{display:none}
  .release-card{height:88px;padding:10px 11px;border-radius:13px;align-items:center}
  .release-copy small{font-size:7px;line-height:1.2;margin-bottom:6px}
  .release-copy strong{font-size:10px;line-height:1.25}
  .release-mark{width:26px;flex:0 0 26px}
}

@media(max-width:390px) and (orientation:portrait){
  header{left:5px;right:5px}
  .nav a{font-size:9px;padding:0 2px}
  .personnage{height:58svh;bottom:25svh}
  .news-panel{left:5px;right:5px;gap:5px}
  .news-card,.release-card{height:82px}
  .news-card{grid-template-columns:46px minmax(0,1fr);padding:6px;gap:6px}
  .news-thumb{width:46px;height:68px}
  .news-copy strong{font-size:9px}
  .news-copy span,.news-copy time{font-size:6.5px}
  .release-copy strong{font-size:9px}
}

@media(orientation:landscape) and (max-height:700px){
  .scene-bg{object-position:center}
  .personnage{left:30%;bottom:-5svh;height:82svh;max-width:54vw}
  .news-panel{top:82px;right:10px;width:43vw;gap:6px}
  .news-card{height:74px;padding:6px 9px;grid-template-columns:70px 1fr 28px;gap:8px;border-radius:12px}
  .news-thumb{height:60px;border-radius:8px}
  .news-copy strong{font-size:12px;margin-bottom:3px}
  .news-copy span{font-size:8px;margin-bottom:3px}
  .news-copy time{font-size:8px}
  .news-arrow{width:25px;height:25px;font-size:17px;border-width:1px}
  .release-card{height:54px;padding:8px 13px;border-radius:12px}
  .release-copy small{font-size:8px;margin-bottom:3px}
  .release-copy strong{font-size:11px}
  .release-mark{width:34px}
  header{top:8px;left:10px;right:10px;height:62px;min-height:62px;border-radius:21px;padding:0 4px}
  .nav a{font-size:clamp(9px,1.7vw,13px);padding:0 4px}
}
</style>
</head>
