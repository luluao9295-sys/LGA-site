<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGA — Actualités</title>
<link rel="stylesheet" href="menu-lga.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#020103}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.actualites-page{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;background:#020103;isolation:isolate}
.actualites-page::before{content:"";position:absolute;inset:-28px;z-index:-2;background:url('20_decor_complet_sans_menu.svg?v=2') center/cover no-repeat;filter:blur(20px) brightness(.48) saturate(1.15);transform:scale(1.08)}
.actualites-page::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 48%,rgba(255,0,119,.08),transparent 48%),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.22))}
.actualites-master{position:absolute;display:block;z-index:0;max-width:none}
.lga-menu{position:absolute;top:2.8svh;left:3.2vw;right:3.2vw;margin:0;z-index:100}

/* PC / grand écran : plein cadre */
@media (min-width:1001px){
  .actualites-master{inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}
}

/* Tablette : composition entière, centrée */
@media (min-width:601px) and (max-width:1000px){
  .actualites-page{min-height:700px}
  .actualites-master{left:50%;top:52%;width:100%;height:auto;max-height:82svh;object-fit:contain;transform:translate(-50%,-50%)}
  .lga-menu{top:2.7svh;left:18px;right:18px;margin:0}
}

/* iPhone / mobile : aucune partie importante coupée */
@media (max-width:600px){
  .actualites-page{min-height:640px}
  .actualites-page::before{inset:-45px;filter:blur(24px) brightness(.38) saturate(1.18)}
  .actualites-master{left:50%;top:51%;width:100%;height:auto;max-height:78svh;object-fit:contain;transform:translate(-50%,-50%)}
  .lga-menu{top:2.7svh;left:9px;right:9px;margin:0}
}
@media (max-width:390px){
  .actualites-master{top:52%;max-height:76svh}
  .lga-menu{left:5px;right:5px}
}

/* iPhone couché / écrans bas */
@media (max-height:520px) and (orientation:landscape){
  .actualites-page{min-height:100svh}
  .actualites-master{inset:0;width:100%;height:100%;max-height:none;object-fit:cover;object-position:center;transform:none}
  .lga-menu{top:10px}
}
</style>
</head>
<body>
<div class="actualites-page">
  <img class="actualites-master" src="20_decor_complet_sans_menu.svg?v=2" alt="Actualités LGA">
  <header class="lga-menu">
    <nav class="lga-nav">
      <a href="index.html">ACCUEIL</a>
      <a class="active" href="actualites.html">ACTUALITÉS</a>
      <a href="album.html">ALBUM</a>
      <a href="apropos.html">À PROPOS</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>
</div>
</body>
</html>
